
name: Extract ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Extract ZIP
        run: |
          mkdir -p extracted
          find . -maxdepth 1 -name "*.zip" -type f | while read file; do
            unzip -o "$file" -d extracted/
          done

      - name: Upload extracted files to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extracted/
          git commit -m "Extract ZIP contents" || true
          git push
